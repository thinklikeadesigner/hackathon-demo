[project]
name = "cascade-memory"
version = "0.1.0"
description = "Pluggable memory system for AI agents — core of the Cascade Portable Memory Format"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
supabase = [
    "supabase>=2.12.0",
]
gemini = [
    "google-genai>=1.0",
]
anthropic = [
    "anthropic>=0.43.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
